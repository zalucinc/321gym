# xcodegen spec. Regenerate the Xcode project with: cd ios && xcodegen generate
name: Gym321
options:
  bundleIdPrefix: com.zalucinc
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: 6FMHSCZ2RS
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Gym321:
    type: application
    platform: iOS
    sources: [Gym321]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zalucinc.gym321
        PRODUCT_NAME: 321gym
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Gym321/Info.plist
      properties:
        CFBundleDisplayName: 321gym
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UIUserInterfaceStyle: Dark
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
